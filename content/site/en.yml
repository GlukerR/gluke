services:
  - id: product-modeling
    title: 3D modeling of products and equipment
    description: Accurate models built from CAD data, drawings, dimensions, photographs or a physical sample.
    proof: Getic, WiederKraft, HouseGuru
  - id: catalog-visualization
    title: Catalogue visualization
    description: A single set of angles, materials and lighting for a website, catalogue or marketplace.
    proof: Kiparis, WiederKraft, HouseGuru
  - id: product-animation
    title: Animation and product videos
    description: Showing how a product is built, connected, moved and what makes it different.
    proof: Getic, WiederKraft, HouseGuru
  - id: web-ready-models
    title: 3D models for the web and real-time
    description: Geometry, material and texture optimization for GLB, WebGL and interactive viewing.
    proof: 50+ Getic models
  - id: exploded-views
    title: Exploded views
    description: A clear look at the internal structure, the parts and the assembly order of a product.
    proof: HouseGuru
  - id: print-materials
    title: Print-ready materials
    description: High-resolution imagery prepared for catalogues, presentations and large-format printing.
    proof: WiederKraft

process:
  - position: 1
    title: We receive the source materials
    description: Drawings, CAD files, photographs, a physical sample and the requirements for the result.
  - position: 2
    title: We scope the task
    description: We define the volume, formats, deadlines, camera angles and level of detail.
  - position: 3
    title: We build the model
    description: Modeling, materials, textures, lighting and technical preparation.
  - position: 4
    title: We approve the result
    description: We share work in progress and apply the agreed corrections.
  - position: 5
    title: We hand over the materials
    description: We prepare images, video or 3D files in the formats needed for a website, catalogue, marketplace or print.

audiences:
  - Equipment and product manufacturers
  - Online stores and marketplaces
  - Agencies and production teams

