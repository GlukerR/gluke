faq:
  - question: How much does a 3D model cost?
    answer: The average project budget starts from €500. Small one-off tasks are quoted individually — send us a brief and we will give you an exact price for your task.
  - question: What materials do you need to get started?
    answer: Drawings, CAD files, photographs or a physical sample. We work with whatever you have — from source files to a finished model.
  - question: What formats do you deliver?
    answer: High-resolution images for web, catalogues and print; video for websites and marketplaces; GLB models for WebGL viewers.
  - question: Do you work with marketplaces (WB, Ozon)?
    answer: Yes — catalogue images, 3D models and assembly videos for WB and Ozon. For M1 GROUP alone we produced 100+ renders and product card covers.
    cases:
      - label: M1 GROUP
        slug: m1-group
      - label: HouseGuru
        slug: house-guru
  - question: Do you do animation and video?
    answer: Yes, it is a separate line of work — product animations, cinematics and advertising films. Scenes are built in Unreal Engine, from device animations to full advertising creatives.
  - question: Can I order an interactive 3D model for my website?
    answer: Yes, we prepare an optimized GLB and integrate it into a product page or catalogue with a WebGL viewer.
    cases:
      - label: Getic
        slug: getic
      - label: SoftLogic
        slug: softlogic

process:
  - position: 1
    title: We receive the source materials
    description: Drawings, CAD files, photographs, a physical sample and the requirements for the result.
  - position: 2
    title: We scope the task
    description: We define the volume, formats, deadlines, camera angles and level of detail.
  - position: 3
    title: We build the model
    description: Modeling, materials, textures, lighting and technical preparation.
  - position: 4
    title: We approve the result
    description: We share work in progress and apply revisions.
  - position: 5
    title: We hand over the materials
    description: We prepare images, video or 3D files in the formats needed for a website, catalogue, marketplace or print.

audiences:
