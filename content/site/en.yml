process:
  - position: 1
    title: We receive the source materials
    description: Drawings, CAD files, photographs, a physical sample and the requirements for the result.
  - position: 2
    title: We scope the task
    description: We define the volume, formats, deadlines, camera angles and level of detail.
  - position: 3
    title: We build the model
    description: Modeling, materials, textures, lighting and technical preparation.
  - position: 4
    title: We approve the result
    description: We share work in progress and apply the agreed corrections.
  - position: 5
    title: We hand over the materials
    description: We prepare images, video or 3D files in the formats needed for a website, catalogue, marketplace or print.

audiences:
  - Equipment and product manufacturers
  - Online stores and marketplaces
