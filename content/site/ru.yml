faq:
  - question: Сколько стоит 3D-модель?
    answer: Средний бюджет проекта — от 30 000 ₽. Небольшие отдельные задачи оцениваются индивидуально — напишите нам, и мы назовём точную стоимость под вашу задачу.
  - question: Какие материалы нужны для начала работы?
    answer: Чертежи, CAD-файлы, фотографии или физический образец. Работаем с тем, что есть у вас, — от исходников до готовой модели.
  - question: В каких форматах вы отдаёте результат?
    answer: Изображения высокого разрешения для сайта, каталога и печати; видео для сайта и маркетплейсов; GLB-модели для WebGL-вьюверов.
  - question: Работаете ли с маркетплейсами (WB, Ozon)?
    answer: Да — каталожные изображения, 3D-модели и видео сборки для WB и Ozon. Например, для M1 GROUP подготовлено более 100 рендеров и обложек для карточек товаров.
    cases:
      - label: M1 GROUP
        slug: m1-group
      - label: HouseGuru
        slug: house-guru
  - question: Делаете ли анимацию и видео?
    answer: Да — продуктовые анимации, синематики и рекламные ролики. Сцены собираются в Unreal Engine — от анимации устройства до полных рекламных креативов.
  - question: Можно ли заказать интерактивную 3D-модель для сайта?
    answer: Да — подготовим оптимизированный GLB и встроим его в страницу товара или каталог с WebGL-вьювером.
    cases:
      - label: Getic
        slug: getic
      - label: SoftLogic
        slug: softlogic

process:
  - position: 1
    title: Получаем материалы
    description: Чертежи, CAD-файлы, фотографии, физический образец и требования к результату.
  - position: 2
    title: Оцениваем задачу
    description: Определяем объём, форматы, сроки, ракурсы и уровень детализации.
  - position: 3
    title: Создаём модель
    description: Выполняем моделирование, материалы, текстуры, освещение и техническую подготовку.
  - position: 4
    title: Согласовываем результат
    description: Показываем промежуточные материалы и вносим согласованные правки.
  - position: 5
    title: Передаём материалы
    description: Подготавливаем изображения, видео или 3D-файлы в форматах для сайта, каталога, маркетплейса или печати.

audiences:
  - Производители оборудования и продукции
  - Интернет-магазины и маркетплейсы
  - Агентства и производственные команды

