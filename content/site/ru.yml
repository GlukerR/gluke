process:
  - position: 1
    title: Получаем материалы
    description: Чертежи, CAD-файлы, фотографии, физический образец и требования к результату.
  - position: 2
    title: Оцениваем задачу
    description: Определяем объём, форматы, сроки, ракурсы и уровень детализации.
  - position: 3
    title: Создаём модель
    description: Выполняем моделирование, материалы, текстуры, освещение и техническую подготовку.
  - position: 4
    title: Согласовываем результат
    description: Показываем промежуточные материалы и вносим согласованные правки.
  - position: 5
    title: Передаём материалы
    description: Подготавливаем изображения, видео или 3D-файлы в форматах для сайта, каталога, маркетплейса или печати.

audiences:
  - Производители оборудования и продукции
  - Интернет-магазины и маркетплейсы
  - Агентства и производственные команды

