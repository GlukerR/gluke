about:
  title: Внешняя команда визуализации для производителей
  description: Мы соединяем художественную подачу и техническую точность. Работаем с оборудованием, мебелью и потребительскими товарами — от исходных чертежей до готовых материалов для сайта, каталога, маркетплейса или презентации.
  team: Над проектами работает основная команда из 2–3 специалистов. Для крупных задач мы расширяем состав под необходимый объём и сроки.

