services:
  - id: product-modeling
    title: 3D-моделирование продукции и оборудования
    description: Создание точных моделей по CAD, чертежам, размерам, фотографиям или физическому образцу.
    proof: Getic, WiederKraft, HouseGuru
  - id: catalog-visualization
    title: Каталожная визуализация
    description: Единый набор ракурсов, материалов и освещения для сайта, каталога или маркетплейса.
    proof: Kiparis, WiederKraft, HouseGuru
  - id: product-animation
    title: Анимация и продуктовые видео
    description: Демонстрация устройства, подключения, движения и преимуществ продукта.
    proof: Getic, WiederKraft, HouseGuru
  - id: web-ready-models
    title: 3D-модели для веба и real-time
    description: Оптимизация геометрии, материалов и текстур для GLB, WebGL и интерактивного просмотра.
    proof: 50+ моделей Getic
  - id: exploded-views
    title: Взрыв-схемы
    description: Наглядное представление внутреннего устройства, деталей и порядка сборки продукта.
    proof: HouseGuru
  - id: print-materials
    title: Материалы для печати
    description: Подготовка изображений высокого разрешения для каталогов, презентаций и крупноформатной печати.
    proof: WiederKraft

process:
  - position: 1
    title: Получаем материалы
    description: Чертежи, CAD-файлы, фотографии, физический образец и требования к результату.
  - position: 2
    title: Оцениваем задачу
    description: Определяем объём, форматы, сроки, ракурсы и уровень детализации.
  - position: 3
    title: Создаём модель
    description: Выполняем моделирование, материалы, текстуры, освещение и техническую подготовку.
  - position: 4
    title: Согласовываем результат
    description: Показываем промежуточные материалы и вносим согласованные правки.
  - position: 5
    title: Передаём материалы
    description: Подготавливаем изображения, видео или 3D-файлы в форматах для сайта, каталога, маркетплейса или печати.

audiences:
  - Производители оборудования и продукции
  - Интернет-магазины и маркетплейсы
  - Агентства и производственные команды

