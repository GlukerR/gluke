# Глоссарий базы знаний. Термин — определение в 1–2 предложения простыми
# словами — статья, где он раскрыт подробно (`article`, slug статьи).
# `id` — якорь на странице (/ru/knowledge/glossary#lod) и общий ключ с en.yml:
# набор id в обеих локалях одинаковый, это проверяет `pnpm validate:content`.
# Порядок в файле не важен — страница сортирует термины по алфавиту.
locale: ru
updated: 2026-10-08
title: Словарь 3D-терминов
intro: Слова, которые звучат в разговоре с 3D-специалистом, — простым языком, по одному-два предложения. Если термин разобран подробнее, рядом ссылка на статью.
terms:
  - id: ar
    term: AR
    aka: [дополненная реальность]
    definition: '3D-модель поверх изображения с камеры телефона — товар встаёт в комнате в натуральную величину. На сайте работает без приложения — через встроенные просмотрщики iPhone и Android.'
    article: ar-on-website
  - id: cad
    term: CAD-модель
    aka: [конструкторская модель]
    definition: 'Модель из конструкторской программы с точными поверхностями и размерами. Лучший источник геометрии для визуализации; перед рендером её переводят в полигоны.'
    article: source-materials
  - id: clay-render
    term: Clay-рендер
    aka: [глиняный рендер]
    definition: 'Рендер модели без материалов, обычно серый. На нём видна только форма, поэтому по нему согласуют силуэт, пропорции и детали — до работы с цветом.'
    article: approval-stages
  - id: dpi
    term: DPI
    definition: 'Сколько пикселей приходится на дюйм бумаги при печати. Для экрана DPI ничего не значит; для каталога нужно 300 DPI в итоговом размере.'
    article: image-specs
  - id: draco
    term: Draco
    definition: 'Способ сжатия геометрии в GLB. Заметно уменьшает файл, но телефону приходится распаковывать модель перед показом.'
    article: mobile-3d-performance
  - id: draw-call
    term: Draw call
    aka: [вызов отрисовки]
    definition: 'Одно задание видеокарте нарисовать часть сцены. Каждая деталь со своим материалом — отдельный вызов; сотни вызовов тормозят даже мощный телефон.'
    article: mobile-3d-performance
  - id: fbx
    term: FBX
    definition: 'Формат обмена между 3D-программами и игровыми движками. Хорошо передаёт анимацию и иерархию деталей; материалы переносятся не всегда точно.'
    article: 3d-file-formats
  - id: game-ready
    term: Game-ready модель
    definition: 'Модель, подготовленная для игрового движка — уложена в бюджет треугольников и материалов, с развёрткой, текстурами и уровнями детализации.'
    article: lod
  - id: glb
    term: GLB
    aka: [glTF]
    definition: 'Открытый стандарт 3D для веба; GLB — его версия одним файлом с геометрией, материалами, текстурами и анимацией. Основной формат для 3D на сайте и AR на Android.'
    article: 3d-file-formats
  - id: hdri
    term: HDRI
    definition: 'Панорама окружения с большим запасом яркости. Ею освещают 3D-сцену, и в глянцевых поверхностях отражается настоящая обстановка — студия, улица, интерьер.'
  - id: ktx2
    term: KTX2
    definition: 'Формат текстур, который остаётся сжатым даже в памяти видеокарты. JPEG и PNG там распаковываются целиком, поэтому текстуры для веба и AR переводят в KTX2.'
    article: mobile-3d-performance
  - id: lod
    term: LOD
    aka: [уровни детализации]
    definition: 'Несколько версий одной модели — от подробной до почти силуэта. Движок переключает их по расстоянию до камеры, чтобы сцена с сотнями объектов не тормозила.'
    article: lod
  - id: meshopt
    term: Meshopt
    definition: 'Способ сжать и упорядочить геометрию в GLB — файл меньше, а телефон распаковывает модель быстро. Часто используется вместе с KTX2.'
    article: mobile-3d-performance
  - id: model-viewer
    term: model-viewer
    definition: 'Открытый веб-компонент Google для показа 3D-модели на странице. Одним тегом даёт вращение, зум, постер и кнопку AR.'
    article: 3d-viewer-on-website
  - id: obj
    term: OBJ
    definition: 'Старый простой 3D-формат — геометрия, базовые материалы в соседнем файле .mtl, текстуры отдельными файлами. Открывается почти в любой программе.'
    article: 3d-file-formats
  - id: pantone
    term: Pantone
    definition: 'Каталог цветов для печати и дизайна с номером у каждого цвета. Номер вместе с физическим образцом точнее любого описания словами.'
    article: color-and-materials
  - id: pbr
    term: PBR-материал
    definition: 'Материал, описанный физическими свойствами — цветом, шероховатостью, металличностью. Поэтому он правдоподобно выглядит при любом свете и одинаково переносится между программами и движками.'
    article: color-and-materials
  - id: ral
    term: RAL
    definition: 'Каталог стандартных цветов для металла, пластика и фасадов — у каждого цвета номер, например RAL 9016. Самый надёжный способ передать цвет изделия.'
    article: color-and-materials
  - id: step
    term: STEP
    definition: 'Формат CAD-моделей с точными поверхностями, без текстур. Нужен производству и как исходник для визуализации; для сайта его переводят в GLB.'
    article: 3d-file-formats
  - id: usdz
    term: USDZ
    definition: 'Формат Apple для дополненной реальности. По нему модель открывается в AR прямо из браузера на iPhone и iPad.'
    article: ar-on-website
  - id: webgl
    term: WebGL
    definition: 'Стандарт 3D-графики в браузере. Через него видеокарта рисует модель заново для каждого кадра — поэтому её можно вращать.'
    article: 3d-viewer-on-website
  - id: exploded-view
    term: Взрыв-схема
    definition: 'Изображение, на котором детали изделия разнесены вдоль осей сборки. Показывает состав и порядок сборки — то, что на фото не увидеть.'
    article: exploded-view
  - id: viewer
    term: Вьювер
    aka: [3D-вьювер]
    definition: 'Программа на странице сайта, которая показывает 3D-модель и даёт её вращать и приближать. Бывает готовой, как model-viewer, или своей — для конфигураторов.'
    article: 3d-viewer-on-website
  - id: gloss
    term: Глянец
    aka: [степень блеска]
    definition: 'Насколько поверхность блестит — от матовой до зеркальной. Задаётся отдельно от цвета; один и тот же RAL в матовом и глянцевом исполнении выглядит по-разному.'
    article: color-and-materials
  - id: baking
    term: Запекание
    aka: [bake]
    definition: 'Перенос деталей в текстуры — тени, мелкий рельеф и освещение с подробной модели «запекают» в картинку для облегчённой. Модель выглядит богаче, чем позволяет её сетка.'
  - id: infographics
    term: Инфографика
    definition: 'Изображение товара с подписями, выносками и значками преимуществ. Для маркетплейсов её собирают из рендеров одной модели.'
    article: 3d-for-marketplaces
  - id: source-scene
    term: Исходник сцены
    definition: 'Рабочий файл 3D-программы со светом, камерами и материалами. В отличие от экспорта, в нём любой слой правится отдельно — поэтому для продолжения работы он ценнее всего.'
    article: deliverables
  - id: real-scale
    term: Масштаб 1:1
    aka: [реальный масштаб]
    definition: 'Модель в настоящих единицах — метрах. Без этого в AR дом окажется размером с коробку, а кресло — размером с дом.'
    article: ar-on-website
  - id: normals
    term: Нормали
    definition: 'Направления, в которые «смотрят» грани модели; по ним рассчитывается, как поверхность отражает свет. Сломанные нормали дают тёмные пятна и рваные блики.'
  - id: polygon
    term: Полигон
    definition: 'Плоская грань, из которых складывается поверхность 3D-модели; движки делят полигоны на треугольники. Чем их больше, тем глаже форма и тяжелее модель.'
    article: mobile-3d-performance
  - id: poster
    term: Постер
    definition: 'Картинка того же ракурса, которую показывают на месте 3D-модели, пока та грузится. Страница не стоит пустой даже на медленном интернете.'
    article: 3d-viewer-on-website
  - id: alpha
    term: Прозрачный фон
    aka: [альфа-канал]
    definition: 'Изображение, в котором вокруг товара ничего нет, — его можно поставить на любую подложку. JPEG прозрачность не хранит, нужен PNG; тень делают отдельным полупрозрачным слоем.'
    article: image-specs
  - id: storyboard
    term: Раскадровка
    definition: 'Последовательность ключевых кадров будущего ролика с подписями. Её согласуют до анимации — переставить кадры на бумаге проще, чем в готовом видео.'
    article: product-animation
  - id: angle
    term: Ракурс
    definition: 'Точка, с которой камера смотрит на товар, — спереди, три четверти, сверху. Список ракурсов задают в ТЗ: от него зависит, сколько кадров делать.'
    article: 3d-brief
  - id: cutaway
    term: Разрез
    definition: 'Изображение, на котором часть корпуса срезана, чтобы показать внутреннее устройство. В отличие от взрыв-схемы, детали остаются на своих местах.'
    article: exploded-view
  - id: reference
    term: Референс
    definition: 'Пример, который показывают исполнителю, — картинка, видео или чужая работа с пометкой, что именно в ней нравится: свет, ракурс, фон.'
    article: 3d-brief
  - id: render
    term: Рендер
    definition: 'Изображение, которое компьютер рассчитывает по 3D-сцене — модели, материалам, свету и камере. Хорошо настроенный рендер на нейтральном фоне не отличить от студийного фото.'
    article: render-vs-photo
  - id: mesh
    term: Сетка
    aka: [меш, полигональная сетка]
    definition: 'Поверхность модели из полигонов — вершины, рёбра и грани. Плотность сетки определяет, насколько гладкая форма и сколько весит файл.'
    article: lod
  - id: tessellation
    term: Тесселяция
    definition: 'Перевод точных CAD-поверхностей в сетку треугольников. Мелкая сетка — гладко, но тяжело; крупная — легко, но видны грани.'
    article: 3d-file-formats
  - id: texture
    term: Текстура
    aka: [карта материала]
    definition: 'Изображение, которое накладывают на модель, — цвет, рисунок, шероховатость, рельеф. В веб-моделях текстуры обычно занимают больше всего памяти.'
    article: mobile-3d-performance
  - id: topology
    term: Топология
    definition: 'То, как проложены рёбра сетки по поверхности модели. Аккуратная топология нужна, чтобы модель чисто сглаживалась, правильно гнулась в анимации и упрощалась без дыр.'
  - id: uv
    term: UV-развёртка
    definition: 'Раскладка поверхности модели на плоскость, как выкройка. По ней на модель ложатся текстуры, надписи и логотипы.'
  - id: animatic
    term: Аниматик
    aka: [черновая анимация]
    definition: 'Черновая версия ролика: движение без финальных материалов и света. На нём согласуют, что и как движется, — после финального рендера любая правка движения означает переделку.'
    article: product-animation
  - id: reference-model
    term: Эталонная модель
    definition: 'Первая модель серии, на которой согласуют детализацию, материалы и свет. Остальные приводят к ней — так серия выглядит единой.'
    article: approval-stages
