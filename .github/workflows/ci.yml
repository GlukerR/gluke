name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Изолированный vue-tsc: генерирует типы в .nuxt-typecheck и проверяет
      # проект по tsconfig.typecheck.json (см. scripts/typecheck.mjs).
      - name: Run typecheck
        run: pnpm typecheck

  content:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nuxt Content не проверяет файлы против схемы коллекции — данные едут в
      # базу как есть, и ошибка в YAML всплывает только на странице. Скрипт
      # прогоняет content/ через те же zod-схемы (см. scripts/validate-content.mjs).
      - name: Validate content against the collection schemas
        run: pnpm validate:content

      # llms.txt читают ИИ-краулеры, и он уже однажды разошёлся с кейсами
      # (обещал «14+ AR models», которых не было). Файл генерируется из
      # контента при сборке; здесь проверяется, что закоммиченная версия
      # совпадает с тем, что даёт генератор.
      - name: Check llms.txt matches the content
        run: |
          pnpm llms
          git diff --exit-code -- public/llms.txt

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Полная production-сборка (ровно то, что запускает Vercel): `nuxt build`
      # вместе с prerender (sitemap/robots). На Linux prerender работает без
      # Windows-ограничений, поэтому здесь проверяется весь конвейер.
      - name: Run production build
        run: pnpm build

  postdeploy:
    name: Notify search engines
    # Только на push в master (не на PR) и после успешной сборки: дожидается
    # успешного деплоя коммита и пингует IndexNow.
    #
    # Домен здесь не трогается — production-алиас Vercel назначает сам. Ждём
    # через GitHub Deployments API (их заводит git-интеграция Vercel), поэтому
    # хватает встроенного GITHUB_TOKEN и отдельный токен Vercel не нужен.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint, typecheck, content, build]
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Wait for the deployment, then ping IndexNow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          NUXT_SITE_URL: https://gluke.ru
        run: node scripts/postdeploy.mjs
