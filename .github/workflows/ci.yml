name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Изолированный vue-tsc: генерирует типы в .nuxt-typecheck и проверяет
      # проект по tsconfig.typecheck.json (см. scripts/typecheck.mjs).
      - name: Run typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Полная production-сборка (ровно то, что запускает Vercel): `nuxt build`
      # вместе с prerender (sitemap/robots). На Linux prerender работает без
      # Windows-ограничений, поэтому здесь проверяется весь конвейер.
      - name: Run production build
        run: pnpm build

  indexnow:
    name: IndexNow ping
    # Пингуем только на push в master (не на PR) и после успешной сборки.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint, typecheck, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Дать Vercel-деплою несколько секунд форы, чтобы в момент пинга боты
      # уже застали свежую версию. Engine и так заново переобходят URL чуть позже.
      - name: Wait for deploy
        run: sleep 90

      - name: Ping IndexNow
        env:
          NUXT_SITE_URL: https://gluke.ru
        run: node scripts/indexnow.mjs
